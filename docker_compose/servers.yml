version: "3.8"

# Dependency stack for FormShare (MySQL & ElasticSearch).
#
# Usage:
#   docker compose --env-file .env -f servers.yml up -d
#
# ElasticSearch runs as a SINGLE node, on purpose.
#
# FormShare asks ElasticSearch for very little: exact-term filters, a sort by
# date, and one genuine capability -- the geotile_grid + geo_centroid the map
# uses to cluster GPS points. Measured on one shard, ten million points occupy
# under 2 GB and the heaviest possible map query (every point scanned, ten
# thousand clusters) answers in about 80 ms, sustaining ~95 of those per second
# before latency moves. Nothing here needs a cluster.
#
# Two nodes would have been the worst of the options: a two-node cluster has a
# quorum of two, so losing either one leaves the survivor without a master and
# the cluster read-only. It doubles the failure surface without tolerating a
# failure. Real fault tolerance starts at three master-eligible nodes; if that
# is ever wanted, add es02 and es03 together, set
# cluster.initial_master_nodes on all three, drop discovery.type, and put the
# replicas back with elasticsearch.<index>.number_of_replicas.
#
# Being single-node also removes the need for transport TLS. Those certificates
# only ever encrypted node-to-node traffic (HTTP was already plaintext here via
# xpack.security.http.ssl.enabled=false), and with one node there is no such
# traffic, so the CA and transport.p12 secured nothing. That is why the
# certificate generation is gone.
#
# EXPECTED AT STARTUP -- this is not a fault:
#
#   [WARN][o.e.b.BootstrapChecks] Transport SSL must be enabled if security is
#   enabled. Please set [xpack.security.transport.ssl.enabled] to [true]...
#
# Verified against 9.2.1 with exactly these settings: the check is downgraded
# to a warning under discovery.type=single-node, the node starts, reaches
# green, and serves authenticated requests. Silencing it would mean generating
# a certificate so the node can encrypt traffic to itself.

services:
  mysql:
    image: mysql:8.4.7
    container_name: ${COMPOSE_PROJECT_NAME:-formshare}_mysql
    cap_add:
      - SYS_NICE
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ${FS_DATA_DIR:-/opt/formshare}/mysql:/var/lib/mysql
      - ${FS_DATA_DIR:-/opt/formshare}/mysql-files:/var/lib/mysql-files
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p $${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - fsnet

  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_IMAGE_TAG:-9.2.1}
    container_name: ${COMPOSE_PROJECT_NAME:-formshare}_es01
    environment:
      node.name: es01
      cluster.name: ${ES_CLUSTER_NAME:-fs-es-cluster}

      # One node, forming no cluster. This also tells ElasticSearch to skip the
      # bootstrap checks that would otherwise demand transport TLS.
      discovery.type: single-node

      network.host: 0.0.0.0

      # Heap is not the resource that matters here. Aggregations over geo_point
      # and keyword fields read doc values, which are memory-mapped and served
      # from the OS page cache, so heap stays flat while the index grows -- the
      # fielddata and request breakers never moved off zero at ten million
      # points.
      #
      # The heap is pre-touched, so it is resident from startup; the JVM adds
      # ~260 MB of metaspace and code cache plus thread stacks. One node at
      # 512m costs ~0.9 GB, where two nodes at 512m cost ~1.8 GB. What must
      # also fit in free RAM is the index itself -- roughly 2 GB per ten
      # million submissions -- but that is shared, reclaimable page cache.
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: "-Xms${ES_HEAP:-512m} -Xmx${ES_HEAP:-512m}"

      # Security on, HTTP in plaintext behind the compose network.
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ${FS_DATA_DIR:-/opt/formshare}/elasticsearch/esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - fsnet

networks:
  fsnet:
    name: ${FS_NETWORK_NAME:-formshare_fsnet}
