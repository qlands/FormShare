version: "3.8"

# Dependency stack for FormShare (databases/search).
#
# Usage:
#   docker compose --env-file .env -f docker-compose.deps.yml up -d
#
# Notes:
# - No fixed IPs: services discover each other by service name (Docker DNS).
# - Secrets/config move to .env (see .env.example).

services:
  mysql:
    image: mysql:8.4.7
    container_name: ${COMPOSE_PROJECT_NAME:-formshare}_mysql
    cap_add:
      - SYS_NICE
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ${FS_DATA_DIR:-/opt/formshare}/mysql:/var/lib/mysql
      - ${FS_DATA_DIR:-/opt/formshare}/mysql-files:/var/lib/mysql-files
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p $${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - fsnet

  es01:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.1
    container_name: ${COMPOSE_PROJECT_NAME:-formshare}_es01
    environment:
      # Cluster/node identity
      node.name: es01
      cluster.name: ${ES_CLUSTER_NAME:-fs-es-cluster}
      discovery.seed_hosts: es02
      cluster.initial_master_nodes: es01,es02

      # Networking
      network.host: 0.0.0.0

      # Memory
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: "-Xms${ES_HEAP:-512m} -Xmx${ES_HEAP:-512m}"

      # Security required in ES 9.x
      xpack.security.enabled: "true"

      # HTTP is plaintext (no HTTPS)
      xpack.security.http.ssl.enabled: "false"

      # Transport TLS required
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.security.transport.ssl.keystore.path: /usr/share/elasticsearch/config/certs/transport.p12
      xpack.security.transport.ssl.truststore.path: /usr/share/elasticsearch/config/certs/transport.p12

      # Cluster superuser password
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ${FS_DATA_DIR:-/opt/formshare}/elasticsearch/esdata:/usr/share/elasticsearch/data
      - ${FS_DATA_DIR:-/opt/formshare}/elasticsearch/certs:/usr/share/elasticsearch/config/certs
    command: >
      bash -lc '
        set -euo pipefail

        CERT_DIR=/usr/share/elasticsearch/config/certs
        mkdir -p "$$CERT_DIR"

        # If CA already exists → skip generation → start ES normally
        if [ -f "$$CERT_DIR/ca.p12" ]; then
          echo "CA already exists. Skipping cert generation."
          exec /usr/local/bin/docker-entrypoint.sh
        fi

        echo "Generating CA and transport certs..."
        bin/elasticsearch-certutil ca --silent --out "$$CERT_DIR/ca.p12" --pass ""

        # Use DNS names (service names) instead of fixed IPs
        bin/elasticsearch-certutil cert --silent \
          --ca "$$CERT_DIR/ca.p12" --ca-pass "" \
          --out "$$CERT_DIR/transport.p12" --pass "" \
          --dns es01 --dns es02 --dns localhost \
          --ip 127.0.0.1

        exec /usr/local/bin/docker-entrypoint.sh
      '
    networks:
      - fsnet

  es02:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_IMAGE_TAG:-9.2.1}
    container_name: ${COMPOSE_PROJECT_NAME:-formshare}_es02
    depends_on:
      es01:
        condition: service_started
    environment:
      node.name: es02
      cluster.name: ${ES_CLUSTER_NAME:-fs-es-cluster}
      discovery.seed_hosts: es01
      cluster.initial_master_nodes: es01,es02
      network.host: 0.0.0.0
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: "-Xms${ES_HEAP:-512m} -Xmx${ES_HEAP:-512m}"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "true"
      xpack.security.transport.ssl.verification_mode: certificate
      xpack.security.transport.ssl.keystore.path: /usr/share/elasticsearch/config/certs/transport.p12
      xpack.security.transport.ssl.truststore.path: /usr/share/elasticsearch/config/certs/transport.p12
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - ${FS_DATA_DIR:-/opt/formshare}/elasticsearch/esdata2:/usr/share/elasticsearch/data
      - ${FS_DATA_DIR:-/opt/formshare}/elasticsearch/certs:/usr/share/elasticsearch/config/certs
    command: >
      bash -lc '
        set -euo pipefail
        CERT_DIR=/usr/share/elasticsearch/config/certs

        for i in $$(seq 1 120); do
          [ -f "$$CERT_DIR/transport.p12" ] && break
          sleep 1
        done

        if [ ! -f "$$CERT_DIR/transport.p12" ]; then
          echo "transport.p12 not found after waiting; aborting."
          exit 1
        fi

        exec /usr/local/bin/docker-entrypoint.sh
      '
    networks:
      - fsnet

networks:
  fsnet:
    name: ${FS_NETWORK_NAME:-formshare_fsnet}
