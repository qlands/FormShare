version: 2

jobs:
  py-3.13:
    docker:
      - image: qlands/odktools_circleci:20260216

      # ---------------------------------------------------------
      # Elasticsearch 9.2.1
      # - HTTP (no TLS) for client traffic: http://localhost:9200
      # - TLS ONLY for transport (required)
      # - Self-generates transport certs on startup (no docker needed)
      # ---------------------------------------------------------
      - image: docker.elastic.co/elasticsearch/elasticsearch:9.2.1
        environment:
          - discovery.type=single-node
          - bootstrap.memory_lock=true

          # Security required in ES 9.x
          - xpack.security.enabled=true

          # HTTP is plaintext
          - xpack.security.http.ssl.enabled=false

          # Transport TLS required
          - xpack.security.transport.ssl.enabled=true
          - xpack.security.transport.ssl.verification_mode=certificate
          - xpack.security.transport.ssl.keystore.path=/usr/share/elasticsearch/config/certs/transport.p12
          - xpack.security.transport.ssl.truststore.path=/usr/share/elasticsearch/config/certs/transport.p12

          # Fixed password for CI
          - ELASTIC_PASSWORD=RxlCXBATIkd8meZ97XH8z

          - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
        command: >
          bash -lc '
            set -euo pipefail;
            CERT_DIR=/usr/share/elasticsearch/config/certs;
            mkdir -p "$CERT_DIR";

            # Create CA (PKCS#12, empty password)
            if [ ! -f "$CERT_DIR/ca.p12" ]; then
              bin/elasticsearch-certutil ca --silent --out "$CERT_DIR/ca.p12" --pass "";
            fi

            # Create transport cert (PKCS#12, empty password)
            if [ ! -f "$CERT_DIR/transport.p12" ]; then
              bin/elasticsearch-certutil cert --silent \
                --ca "$CERT_DIR/ca.p12" --ca-pass "" \
                --out "$CERT_DIR/transport.p12" --pass "" \
                --dns localhost --ip 127.0.0.1;
            fi

            exec /usr/local/bin/docker-entrypoint.sh;
          '
        ports:
          - 9200:9200

      # ---------------------------------------------------------
      # MySQL 8.0.42
      # -----------------------------------------------
      - image: mysql:8.4.7
        cap_add:
          - SYS_NICE
        environment:
          - MYSQL_ROOT_PASSWORD=circleci
        ports:
          - 3306:3306

    resource_class: large
    working_directory: ~/work

    steps:
      - checkout

      - run: | # We will just build master-2.0 branch
          if [ "$CIRCLE_BRANCH" != "master-2.0" ]; then
            exit 1
          fi

      - restore_cache:
          key: requirements-{{ .Branch }}-{{ .Environment.CIRCLE_JOB }}-{{ checksum "requirements.txt" }}

      - run:
          name: Run Redis + Mosquitto
          command: |
            sudo chown -R redis /etc/redis
            sudo chgrp -R redis /etc/redis
            sudo chown -R redis /var/log/redis
            sudo chgrp -R redis /var/log/redis
            sudo chown -R redis /var/lib/redis
            sudo chgrp -R redis /var/lib/redis
            sudo /etc/init.d/redis-server start
            sudo service mosquitto start
            tail -f /dev/null
          background: true

      - run:
          name: Wait for MySQL + Elasticsearch
          command: |
            set -e

            echo "Waiting for MySQL..."
            for i in $(seq 1 60); do
              if mysql -h 127.0.0.1 -u root --password=circleci -e "SELECT 1" >/dev/null 2>&1; then
                echo "MySQL is up."
                break
              fi
              sleep 2
              if [ "$i" -eq 60 ]; then
                echo "MySQL did not start in time."
                exit 1
              fi
            done

            echo "Waiting for Elasticsearch (HTTP)..."
            for i in $(seq 1 90); do
              if curl -s -u elastic:formshareci http://localhost:9200 >/dev/null 2>&1; then
                echo "Elasticsearch is up."
                break
              fi
              sleep 2
              if [ "$i" -eq 90 ]; then
                echo "Elasticsearch did not start in time."
                curl -s http://localhost:9200 || true
                exit 1
              fi
            done

      - run:
          name: Install dependencies
          command: |
            sudo chown -R circleci /opt/formshare_repository
            sudo chown -R circleci /opt/formshare_log
            sudo chown -R circleci /opt/formshare_celery
            sudo chown -R circleci /opt/formshare_gunicorn
            sudo chown -R circleci /opt/formshare_config

            sudo chgrp -R circleci /opt/formshare_repository
            sudo chgrp -R circleci /opt/formshare_log
            sudo chgrp -R circleci /opt/formshare_celery
            sudo chgrp -R circleci /opt/formshare_gunicorn
            sudo chgrp -R circleci /opt/formshare_config

            pip install -r requirements.txt --user
            pip install csvkit==1.0.6 --user
            pip install codecov --user
            /home/circleci/.local/bin/codecov || true

            mysql -h 127.0.0.1 -u root --password=circleci \
              --execute='CREATE SCHEMA IF NOT EXISTS formshare'
            mysql_tzinfo_to_sql /usr/share/zoneinfo | \
              mysql -h 127.0.0.1 -u root --password=circleci mysql

            python3 create_config.py --daemon --capture_output \
              --mysql_host 127.0.0.1 \
              --mysql_user_name root \
              --mysql_user_password circleci \
              --repository_path /opt/formshare_repository \
              --odktools_path /opt/odktools \
              --elastic_search_host localhost \
              --elastic_search_port 9200 \
              --formshare_host localhost \
              --formshare_port 5900 \
              --forwarded_allow_ip localhost \
              --pid_file /opt/formshare_gunicorn/formshare.pid \
              --error_log_file /opt/formshare_log/error_log \
              /opt/formshare_config/development.ini

            ln -s /opt/formshare_config/development.ini ./development.ini

            python3 ./download_nltk_packages.py
            python3 configure_celery.py ./development.ini
            python3 configure_flatten.py
            python3 setup.py install --user
            python3 setup.py compile_catalog

            /home/circleci/.local/bin/disable_ssl ./development.ini
            /home/circleci/.local/bin/configure_alembic ./development.ini .
            /home/circleci/.local/bin/configure_mysql ./development.ini .
            /home/circleci/.local/bin/configure_tests ./development.ini .
            /home/circleci/.local/bin/alembic upgrade head

            pip install -e git+https://github.com/qlands/formshare_test_plugin.git@main#egg=formshare_test_plugin --user

      - run:
          name: Test code is well formatted
          command: |
            /home/circleci/.local/bin/black --version
            /home/circleci/.local/bin/black formshare --check || exit 1

      - run:
          name: Run Celery in the background
          command: |
            export COLUMNS=80
            export FORMSHARE_PYTEST_RUNNING=true
            /home/circleci/.local/bin/celery -A formshare.config.celery_app worker \
              --loglevel=info -Q FormShare
          background: true

      - run:
          name: Run tests
          command: |
            export FORMSHARE_PYTEST_RUNNING=true
            /home/circleci/.local/bin/pytest -s --cov=formshare

      - run:
          name: upload coverage report
          command: |
            /home/circleci/.local/bin/coverage xml
            (/home/circleci/.local/bin/codecov --required -X search gcov pycov -f coverage.xml) || echo 'Codecov failed to upload'

      - run:
          name: Building artifacts
          command: |
            python3 setup.py sdist
            python3 setup.py bdist_wheel

      - store_artifacts:
          path: dist/
          destination: ./

      - save_cache:
          key: requirements-{{ .Branch }}-{{ .Environment.CIRCLE_JOB }}-{{ checksum "requirements.txt" }}
          paths:
            - /home/circleci/.local/lib
            - /home/circleci/.local/bin

workflows:
  version: 2
  build:
    jobs:
      - py-3.13