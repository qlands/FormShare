version: "3.8"

# ElasticSearch on its own, for a FormShare instance whose MySQL lives
# elsewhere.
#
# Before execution do
#   mkdir -p /opt/formshare/elasticsearch/esdata
#   sudo chmod -R g+w /opt/formshare/elasticsearch
#
# A SINGLE node, on purpose. FormShare asks ElasticSearch for exact-term
# filters, a sort by date, and the geotile_grid + geo_centroid the map uses to
# cluster GPS points. On one shard, ten million points occupy under 2 GB and the
# heaviest map query answers in about 80 ms. A second node would not help: a
# two-node cluster has a quorum of two, so losing either one leaves the cluster
# without a master and read-only -- twice the failure surface, no fault
# tolerance. That starts at three nodes.
#
# Single-node also means no inter-node traffic. The certificates that used to
# be generated here were transport-layer only -- they encrypted node-to-node
# traffic, while HTTP was already plaintext -- so with one node they secured
# nothing, and the generation step is gone.
#
# EXPECTED AT STARTUP -- this is not a fault:
#
#   [WARN][o.e.b.BootstrapChecks] Transport SSL must be enabled if security is
#   enabled. Please set [xpack.security.transport.ssl.enabled] to [true]...
#
# Verified against 9.2.1 with exactly these settings: under
# discovery.type=single-node the check is a warning rather than a fatal error,
# the node starts and reaches green.

services:
  fses01:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.1
    container_name: fses01
    environment:
      - node.name=fses01
      - cluster.name=fs-es-cluster

      # One node, forming no cluster. Also skips the bootstrap check that would
      # otherwise demand transport TLS.
      - discovery.type=single-node

      # Heap is not what grows here. Aggregations read doc values, which are
      # memory-mapped and served from the page cache, so heap stays flat as the
      # index grows -- 512m carried ten million points with the breakers at
      # zero. This node costs ~0.9 GB resident: the pre-touched heap plus about
      # 260 MB of JVM metaspace, code cache and thread stacks. The index itself
      # wants ~2 GB of free RAM per ten million submissions as page cache.
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"

      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false

      - ELASTIC_PASSWORD=my_secure_password

    ulimits:
      memlock:
        soft: -1
        hard: -1

    ports:
      - "9200:9200"

    volumes:
      - /opt/formshare/elasticsearch/esdata:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$${ELASTIC_PASSWORD} http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

    networks:
      - esnet

networks:
  esnet:
    driver: bridge
