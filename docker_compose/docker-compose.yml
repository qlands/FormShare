version: "3.8"

# Before execution do
# mkdir -p /opt/formshare/elasticsearch/esdata
# mkdir -p /opt/formshare/elasticsearch/esdata2
# mkdir -p /opt/formshare/elasticsearch/certs
# sudo chmod -R g+w /opt/formshare/elasticsearch

services:
  fsmysql_20260218:
    image: mysql:8.4.7
    container_name: fs_mysql_20260218
    cap_add:
      - SYS_NICE
    environment:
      MYSQL_ROOT_PASSWORD: my_secure_password
    volumes:
      - /opt/formshare/mysql:/var/lib/mysql
      - /opt/formshare/mysql-files:/var/lib/mysql-files
    networks:
      fsnet:
        ipv4_address: 172.28.1.5

  fses20260218n01:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.1
    container_name: fses20260218n01
    environment:
      # Cluster/node identity
      - node.name=fses20260218n01
      - cluster.name=fs-es-cluster
      - discovery.seed_hosts=fses20260218n02
      - cluster.initial_master_nodes=fses20260218n01,fses20260218n02

      # Networking
      - network.host=0.0.0.0
      - transport.publish_host=172.28.1.2
      - http.publish_host=172.28.1.2

      # Memory
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"

      # Security required in ES 9.x
      - xpack.security.enabled=true

      # HTTP is plaintext (no HTTPS)
      - xpack.security.http.ssl.enabled=false

      # Transport TLS required
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.keystore.path=/usr/share/elasticsearch/config/certs/transport.p12
      - xpack.security.transport.ssl.truststore.path=/usr/share/elasticsearch/config/certs/transport.p12

      # Fixed password (consider moving to .env or Docker secret)
      - ELASTIC_PASSWORD=my_secure_password

    ulimits:
      memlock:
        soft: -1
        hard: -1

    volumes:
      # Data
      - /opt/formshare/elasticsearch/esdata:/usr/share/elasticsearch/data
      # Shared certs between nodes
      - /opt/formshare/elasticsearch/certs:/usr/share/elasticsearch/config/certs

    command: >
      bash -lc '
        set -euo pipefail
      
        CERT_DIR=/usr/share/elasticsearch/config/certs
        mkdir -p "$$CERT_DIR"
      
        # If CA already exists → skip generation → start ES normally
        if [ -f "$$CERT_DIR/ca.p12" ]; then
          echo "CA already exists. Skipping cert generation."
          exec /usr/local/bin/docker-entrypoint.sh
        fi
      
        echo "Generating CA and transport certs..."
      
        bin/elasticsearch-certutil ca --silent --out "$$CERT_DIR/ca.p12" --pass ""
      
        # Add other dns or ip as necessary
        bin/elasticsearch-certutil cert --silent \
          --ca "$$CERT_DIR/ca.p12" --ca-pass "" \
          --out "$$CERT_DIR/transport.p12" --pass "" \
          --dns fses20260218n01 --dns fses20260218n02 --dns localhost \
          --ip 127.0.0.1 --ip 172.28.1.2 --ip 172.28.1.3
      
        exec /usr/local/bin/docker-entrypoint.sh
      '

    networks:
      fsnet:
        ipv4_address: 172.28.1.2


  fses20260218n02:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.1
    container_name: fses20260218n02
    depends_on:
      - fses20260218n01
    environment:
      # Cluster/node identity
      - node.name=fses20260218n02
      - cluster.name=fs-es-cluster
      - discovery.seed_hosts=fses20260218n01
      - cluster.initial_master_nodes=fses20260218n01,fses20260218n02

      # Networking
      - network.host=0.0.0.0
      - transport.publish_host=172.28.1.3
      - http.publish_host=172.28.1.3

      # Memory
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"

      # Security required in ES 9.x
      - xpack.security.enabled=true

      # HTTP is plaintext (no HTTPS)
      - xpack.security.http.ssl.enabled=false

      # Transport TLS required
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.security.transport.ssl.keystore.path=/usr/share/elasticsearch/config/certs/transport.p12
      - xpack.security.transport.ssl.truststore.path=/usr/share/elasticsearch/config/certs/transport.p12

      # Same fixed password (cluster-wide)
      - ELASTIC_PASSWORD=my_secure_password

    ulimits:
      memlock:
        soft: -1
        hard: -1

    volumes:
      - /opt/formshare/elasticsearch/esdata2:/usr/share/elasticsearch/data
      - /opt/formshare/elasticsearch/certs:/usr/share/elasticsearch/config/certs

    command: >
      bash -lc '
        set -euo pipefail
        CERT_DIR=/usr/share/elasticsearch/config/certs
      
        for i in $$(seq 1 120); do
          [ -f "$$CERT_DIR/transport.p12" ] && break
          sleep 1
        done
      
        if [ ! -f "$$CERT_DIR/transport.p12" ]; then
          echo "transport.p12 not found after waiting; aborting."
          exit 1
        fi
      
        exec /usr/local/bin/docker-entrypoint.sh
      '

    networks:
      fsnet:
        ipv4_address: 172.28.1.3

  formshare_20260218:
    image: qlands/formshare2:20260218
    container_name: formshare_20260218
    environment:
      MYSQL_HOST_NAME: 172.28.1.5
      MYSQL_USER_NAME: root
      MYSQL_USER_PASSWORD: my_secure_password
      FORMSHARE_ADMIN_USER: admin
      FORMSHARE_ADMIN_EMAIL: admin@myserver.com
      FORMSHARE_ADMIN_PASSWORD: my_secure_password
      ELASTIC_SEARCH_HOST: 172.28.1.2
      ELASTIC_SEARCH_PORT: 9200
      ELASTIC_USER: elastic
      ELASTIC_PASSWORD: my_secure_password
      FORMSHARE_HOST: 172.28.1.4
      FORMSHARE_PORT: 5900
      FORWARDED_ALLOW_IP: 172.28.1.4
      WAIT_HOSTS_TIMEOUT: 360
      WAIT_HOSTS: 172.28.1.5:3306, 172.28.1.2:9200
    volumes:
      - /opt/formshare/repository:/opt/formshare_repository
      - /opt/formshare/log:/opt/formshare_log
      - /opt/formshare/celery:/opt/formshare_celery
      - /opt/formshare/config:/opt/formshare_config
      - /opt/formshare/plugins:/opt/formshare_plugins
      - /opt/formshare/formshare_odata_webapps:/opt/formshare_odata_webapps
      - /opt/formshare/mosquitto:/etc/mosquitto/conf.d/
    ports:
      - 5900:5900
      - 9001:9001
    networks:
      fsnet: 
        ipv4_address: 172.28.1.4
networks:
  fsnet:
     ipam:
        driver: default
        config:
          - subnet: 172.28.0.0/16
